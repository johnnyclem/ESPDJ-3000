[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espdj-prep"
version = "0.1.0"
description = "ESP-DJ3000 desktop track prep: WAV analysis -> track.json sidecars, Rekordbox XML import, stems interleaving"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
espdj-prep = "espdj_prep.cli:main"

[tool.setuptools.packages.find]
include = ["espdj_prep*"]
